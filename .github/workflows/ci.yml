name: ci

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main

jobs:
  test:
    name: Typecheck + tests + e2e + build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit + component tests
        run: pnpm -r test

      # Browser-level smoke. The self-contained specs (z-order / modal stacking
      # regression proofs) run headless with no server; the server-dependent
      # specs (app-load, onboarding) skip gracefully when localhost:5173 is
      # unreachable. Adding a served-app e2e (vite preview + API) is a tracked
      # follow-up — see docs/build-ship-pipeline-design-2026-06-08.md.
      - name: Install Playwright browser (chromium)
        run: pnpm --filter @pc/web exec playwright install --with-deps chromium

      - name: E2E smoke (Playwright)
        run: pnpm --filter @pc/web test:e2e

      # Catches packaging breaks (tsc -b project refs + vite build) at PR time
      # instead of at release-tag time.
      - name: Web build smoke
        run: pnpm --filter @pc/web build
