name: release

# Tag convention:
#   stable release:  vX.Y.Z           (e.g. v1.2.3)       → full release, latest.yml updated
#   beta prerelease: vX.Y.Z-beta.N    (e.g. v1.2.3-beta.1) → GitHub prerelease, latest stable links skipped
# Any tag containing '-' is treated as a prerelease. Workflow uses the
# is_prerelease step output to branch publish behavior.
# To cut a beta: bump apps/desktop/package.json version to x.y.z-beta.N, commit, tag vx.y.z-beta.N off dev.
# To cut stable: bump version to x.y.z, commit, tag vx.y.z off the release branch.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Release gate (pc-pty-chat-300): the suite must pass before anything builds,
  # signs, or publishes. The build matrix `needs: test`, so a tagged release with
  # a red typecheck/test will NOT ship. Mirrors ci.yml; fast (Linux, no desktop build).
  test:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit tests
        run: pnpm -r test

  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Serialize publish jobs (pc-pty-chat-302): electron-builder does
      # get-or-create-release per job; running the 3 platforms in parallel races
      # on release creation → the 2nd+ get 422 already_exists and the DMG never
      # uploads. max-parallel:1 = first job creates the release, the rest upload
      # into it. (Slower; a build-then-single-publish restructure is the faster fix.)
      max-parallel: 1
      matrix:
        # Windows-only (2026-07-01, Emerson): macOS DROPPED. This is a personal
        # Windows app; macOS notarization is gated on an Apple Developer legal
        # agreement that isn't in effect (notarytool HTTP 403), so the mac job
        # blocked every release. The mac-gated steps below (startsWith(matrix.os,
        # 'macos')) stay in the file, inert, so re-adding 'macos-14' here is the
        # only change needed if mac ships again.
        os: [windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Detect whether this tag is a prerelease (any '-' in the tag name).
      # Output: is_prerelease=true|false — used by build/publish steps below.
      - name: Detect prerelease tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" == *"-"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # Mac: native installer drops the binary at ~/.local/bin/claude
      - name: Install Claude CLI 2.1.165 (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.165
          echo "PC_CLAUDE_SRC=$HOME/.local/bin/claude" >> "$GITHUB_ENV"

      # Windows: download and run the PS1 installer, then locate the binary.
      # NOTE: exact install path depends on the PS1 installer — verify on first live run.
      # PATH is refreshed in-session so where.exe can find the binary.
      - name: Install Claude CLI 2.1.165 (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://claude.ai/install.ps1' -OutFile "$env:TEMP\claude-install.ps1" -UseBasicParsing
          # The installer takes the version POSITIONALLY ($Target param) — '-Version' is not a parameter.
          powershell -ExecutionPolicy Bypass -File "$env:TEMP\claude-install.ps1" 2.1.165
          # The binary self-installs to ~/.local/bin/claude.exe (stage-claude.mjs's default lookup).
          $claudeExe = "$env:USERPROFILE\.local\bin\claude.exe"
          if (-not (Test-Path $claudeExe)) {
            $env:PATH = [System.Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + [System.Environment]::GetEnvironmentVariable('PATH', 'User')
            $claudeExe = (where.exe claude 2>$null | Select-Object -First 1)
          }
          if (-not $claudeExe) { throw 'claude.exe not found after install — check installer output path' }
          "PC_CLAUDE_SRC=$claudeExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # ── macOS signing: import the cert into a dedicated keychain with
      #    NON-INTERACTIVE codesign access (set-key-partition-list) so codesign
      #    never blocks on a GUI keychain prompt in headless CI; also decode the
      #    App Store Connect API key for notarytool. electron-builder then signs
      #    from CSC_KEYCHAIN (we deliberately do NOT pass CSC_LINK to the build
      #    steps, so it won't spin up its own un-authorized keychain). ──────────
      - name: Prepare macOS signing
        if: startsWith(matrix.os, 'macos')
        run: |
          set -euo pipefail
          echo "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          CERT="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KP="$(openssl rand -base64 24)"
          echo "$CSC_LINK" | base64 --decode > "$CERT"
          security create-keychain -p "$KP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KP" "$KEYCHAIN"
          security import "$CERT" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      # ── Tag push: publish to GitHub Releases ─────────────────────────────────

      - name: Build and publish release (macOS)
        if: github.event_name == 'push' && startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          if [[ "${{ steps.tag.outputs.is_prerelease }}" == "true" ]]; then
            pnpm desktop:publish:mac:prerelease
          else
            pnpm desktop:publish:mac
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Stable-named copy so the README can link to a version-agnostic URL
      # (releases/latest/download/Caisson-latest-mac-arm64.dmg). --clobber
      # overwrites the prior release's copy when re-run. Skipped for prereleases.
      - name: Publish "latest" stable macOS link
        if: github.event_name == 'push' && startsWith(matrix.os, 'macos') && steps.tag.outputs.is_prerelease == 'false'
        run: |
          set -euo pipefail
          dmg=$(ls apps/desktop/release/*-mac-arm64.dmg | head -1)
          cp "$dmg" apps/desktop/release/Caisson-latest-mac-arm64.dmg
          gh release upload "${{ github.ref_name }}" apps/desktop/release/Caisson-latest-mac-arm64.dmg --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish release (Windows)
        if: github.event_name == 'push' && matrix.os == 'windows-latest'
        shell: bash
        run: |
          if [[ "${{ steps.tag.outputs.is_prerelease }}" == "true" ]]; then
            pnpm desktop:publish:win:prerelease
          else
            pnpm desktop:publish:win
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Stable-named copy for the version-agnostic README link
      # (releases/latest/download/Caisson-latest-win-x64.exe). Skipped for prereleases.
      - name: Publish "latest" stable Windows link
        if: github.event_name == 'push' && matrix.os == 'windows-latest' && steps.tag.outputs.is_prerelease == 'false'
        shell: pwsh
        run: |
          $exe = Get-ChildItem apps/desktop/release/*-win-x64.exe | Select-Object -First 1
          Copy-Item $exe.FullName apps/desktop/release/Caisson-latest-win-x64.exe -Force
          gh release upload "${{ github.ref_name }}" apps/desktop/release/Caisson-latest-win-x64.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── workflow_dispatch: build only, upload as workflow artifacts ──────────

      - name: Build dist (macOS)
        if: github.event_name == 'workflow_dispatch' && startsWith(matrix.os, 'macos')
        run: pnpm desktop:dist:mac
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build dist (Windows)
        if: github.event_name == 'workflow_dispatch' && matrix.os == 'windows-latest'
        run: pnpm desktop:dist:win

      - name: Upload macOS installers
        if: github.event_name == 'workflow_dispatch' && startsWith(matrix.os, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: mac-dist-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip

      - name: Upload Windows installer
        if: github.event_name == 'workflow_dispatch' && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: apps/desktop/release/*.exe
